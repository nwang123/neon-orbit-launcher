<html lang="en">

<title>NEON ORBIT / Launch Sequence</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}button{position:fixed;right:34px;bottom:27px;z-index:2;border:1px solid #ff28d477;border-radius:0;background:#1d0526cc;color:#ff9ddd;padding:9px 15px;font:10px -apple-system,sans-serif;letter-spacing:1px;cursor:pointer}button:hover{color:#fff;border-color:#00efff}button:focus-visible{outline:2px solid #00efff;outline-offset:4px}@media(prefers-reduced-motion:reduce){button{color:#fff}}</style>

<body><canvas id="stage" aria-label="Neon Orbit cyberpunk night city launch animation"></canvas><button id="skip" type="button" aria-label="Skip animation">SKIP SEQUENCE&nbsp; ↗ &nbsp;ESC</button>
<script>
'use strict';
// All geometry is generated locally. The instrument readings are decorative.
const canvas=document.getElementById('stage'),c=canvas.getContext('2d');
const TAU=Math.PI*2,CYAN='#00efff',VIOLET='#ff28d4',MINT='#c9ff2b',MAGENTA='#ff28d4',LIME='#d4ff36';
let W=0,H=0,S=1,OX=0,OY=0,DPR=1,launched=false,finished=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>(x=clamp(x),x*x*(3-2*x));
const hash=n=>{let v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const stars=Array.from({length:170},(_,i)=>({x:hash(i+1)*1920,y:hash(i+350)*1080,r:.4+hash(i+600)*1.2,z:hash(i+900)}));
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);S=Math.min(W/1920,H/1080);OX=(W-1920*S)/2;OY=(H-1080*S)/2}addEventListener('resize',resize);resize();
function box(x,y,w,h,fill,r=0,stroke=null){if(w<=0||h<=0)return;c.beginPath();if(r)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
function text(s,x,y,size=12,color='#8a9aae',mono=false,align='left',weight=400){c.font=`${weight} ${size}px ${mono?'Menlo,monospace':'-apple-system,BlinkMacSystemFont,sans-serif'}`;c.textBaseline='top';c.textAlign=align;c.fillStyle=color;c.fillText(s,x,y)}
function line(x,y,x2,y2,color,width=1){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function dot(x,y,r,color){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=color;c.fill()}
function arc(x,y,r,a,b,color,width=1){c.beginPath();c.arc(x,y,r,a,b);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function glow(x,y,r,color){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');box(x-r,y-r,r*2,r*2,g)}
function tracked(s,x,y,size=10,color='#8299b1',spacing=3){c.font=`500 ${size}px Menlo,monospace`;c.textBaseline='top';c.textAlign='left';c.fillStyle=color;for(let char of s){c.fillText(char,x,y);x+=c.measureText(char).width+spacing}}
function diamond(x,y,r,color,fill=false){c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*.62,y);c.lineTo(x,y+r);c.lineTo(x-r*.62,y);c.closePath();c.strokeStyle=color;c.lineWidth=1.4;if(fill){c.fillStyle=color;c.fill()}else c.stroke()}
function brandMark(x,y,size){c.save();c.translate(x,y);c.rotate(-.55);c.strokeStyle=CYAN;c.lineWidth=size*.035;c.beginPath();c.ellipse(0,0,size*.46,size*.20,0,.15,TAU-.45);c.stroke();c.beginPath();c.ellipse(0,0,size*.46,size*.20,Math.PI/2,.7,TAU-.1);c.stroke();c.restore();diamond(x,y,size*.20,'#e9fcff',true);dot(x+size*.34,y-size*.32,size*.042,VIOLET)}
function background(t){
 box(-OX/S,-OY/S,W/S,H/S,'#06020d');let g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#0b031a');g.addColorStop(.55,'#190724');g.addColorStop(1,'#050516');box(0,0,1920,1080,g);
 glow(1310,455,520,'#f000bd2b');glow(930,800,650,'#00dfff14');
 // A procedurally drawn neon city: no stock images or brand assets.
 for(let layer=0;layer<2;layer++)for(let i=0;i<37;i++){let x=i*56-45+layer*20,bw=35+hash(i+layer*80)*32,bh=65+hash(i+layer*110+7)*(layer?270:390),y=816-bh;c.save();c.globalAlpha=layer?.75:.32;box(x,y,bw,bh,layer?'#0a061a':'#170b2b',0,layer?'#74367460':'#48264e40');line(x,y,x+bw,y,i%3===0?'#ff2acb70':'#00eaff45',1.5);if(i%6===0){line(x+bw/2,y,x+bw/2,y-36,'#f034e480');dot(x+bw/2,y-37,2,'#ff55d4')}for(let col=0;col<4;col++)for(let row=0;row<Math.floor(bh/18);row++)if(hash(i*150+col*21+row+layer*400)>.55)box(x+6+col*(bw-12)/4,y+12+row*18,2.5,5,i%3===0?'#ff1fb747':'#28dcfc35');c.restore()}
 // Perspective grid accelerates toward the horizon.
 box(0,816,1920,264,'#050619c0');for(let i=-16;i<=16;i++)line(1080+i*19,816,1080+i*190,1080,'#14bde932',1);let speed=reduced?0:(t*.12)%1;for(let j=0;j<15;j++){let a=(j+speed)/15,y=816+Math.pow(a,2.3)*264;line(0,y,1920,y,j%3===0?'#18e9f85c':'#8b37cc40',1)}line(0,815,1920,815,'#00eaff8a',1.4);
 for(let i=0;i<24;i++){let x=hash(i+30)*1920,y=(hash(i+150)*1400+(reduced?0:t*(35+hash(i+5)*60)))%1400-180;for(let j=0;j<7;j++)text(((i*17+j*3)%16).toString(16).toUpperCase(),x,y+j*18,11,`rgba(${i%2?'255,28,202':'0,235,255'},${.035+j*.013})`,true)}
 for(let star of stars)dot(star.x,star.y*.76,star.r,`rgba(191,134,255,${.12+star.z*.4})`);
}
function header(t){
 line(45,40,1875,40,'#ff35ca88',2);box(45,40,170,5,MAGENTA);brandMark(73,81,44);tracked('NEON / ORBIT',112,62,16,'#f5efff',3.8);text('CYBERNETIC LAUNCH SYSTEM',113,90,8.5,'#bd75bc',true);
 box(1431,65,130,28,'#ec00b91a',0,'#ff31d55c');text('NIGHT MODE',1496,74,9,MAGENTA,true,'center');text('LOCAL // 077',1848,74,12,CYAN,true,'right');
 line(45,123,1875,123,'#a847ba40');text('未来接入 / FUTURE UPLINK',62,145,12,'#d9a6e0',true);text(t<4?'01_BOOT':t<11.3?'02_SYNC':'03_ENTER',1848,145,12,LIME,true,'right');
}
function orbitPoint(a,tilt,yaw,r){let x=Math.cos(a)*r,y=Math.sin(a)*r*Math.cos(tilt),z=Math.sin(a)*r*Math.sin(tilt);return [x*Math.cos(yaw)-y*Math.sin(yaw),x*Math.sin(yaw)+y*Math.cos(yaw),z]}
function orbit(cx,cy,r,tilt,yaw,t,color,phase=0){for(let part=0;part<2;part++){c.beginPath();for(let j=0;j<=100;j++){let a=phase+part*Math.PI+j/100*(Math.PI-.19),pt=orbitPoint(a,tilt,yaw,r);if(j===0)c.moveTo(cx+pt[0],cy+pt[1]);else c.lineTo(cx+pt[0],cy+pt[1])}c.strokeStyle=color;c.lineWidth=2.2;c.stroke()}let pt=orbitPoint(t*.55+phase,tilt,yaw,r);glow(cx+pt[0],cy+pt[1],16,color+'35');dot(cx+pt[0],cy+pt[1],3,color);}
function core(cx,cy,r,t,p=1){c.save();c.globalAlpha=p;glow(cx,cy,r*1.75,'#ff00cc20');glow(cx,cy,r*.80,'#00eaff26');let spin=reduced?.35:t*.13;for(let row=-5;row<=5;row++){let lat=row/6*Math.PI/2,rr=r*.71*Math.cos(lat),yy=Math.sin(lat)*r*.71;c.beginPath();for(let i=0;i<=64;i++){let angle=i/64*TAU+spin,px=Math.cos(angle)*rr,py=yy*.91+Math.sin(angle)*rr*.31;if(i===0)c.moveTo(cx+px,cy+py);else c.lineTo(cx+px,cy+py)}c.strokeStyle=`rgba(30,236,255,${.2+Math.cos(lat)*.16})`;c.lineWidth=.7;c.stroke()}for(let longitude=0;longitude<12;longitude++){c.beginPath();for(let i=0;i<=45;i++){let lat=-Math.PI/2+i/45*Math.PI,phi=longitude/12*TAU+spin,x=Math.cos(lat)*Math.cos(phi)*r*.71,z=Math.cos(lat)*Math.sin(phi),y=Math.sin(lat)*r*.71*.91+z*r*.71*.31;if(i===0)c.moveTo(cx+x,cy+y);else c.lineTo(cx+x,cy+y)}c.strokeStyle='rgba(255,45,217,.26)';c.stroke()}for(let i=0;i<58;i++){let lat=Math.asin(hash(i+65)*2-1),phi=hash(i+10)*TAU+spin,x=Math.cos(lat)*Math.cos(phi)*r*.71,z=Math.cos(lat)*Math.sin(phi),y=Math.sin(lat)*r*.71*.91+z*r*.71*.31;dot(cx+x,cy+y,z>0?1.7:.8,z>0?'#a2eaff':'#30658a')}orbit(cx,cy,r,1.13,-.52,t,CYAN);orbit(cx,cy,r*.92,.95,.63,-t,VIOLET,1.2);orbit(cx,cy,r*1.16,1.28,.15,t*.67,'#9045ee',2.7);arc(cx,cy,r*1.3,-Math.PI*.72,Math.PI*.25,'#73b6e324');for(let i=0;i<72;i++){let a=i/72*TAU,inner=r*1.28,outer=inner+(i%6===0?11:4);line(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner,cx+Math.cos(a)*outer,cy+Math.sin(a)*outer,i%6===0?'#a5d9f77a':'#6b9bbb2c',.8)}let pulse=1+(reduced?0:Math.sin(t*1.4)*.035);glow(cx,cy,74*pulse,'#89eeff35');c.save();c.shadowColor=CYAN;c.shadowBlur=24;diamond(cx,cy,43*pulse,'#ddfbff');diamond(cx,cy,22*pulse,'#93efff',true);c.restore();line(cx-8,cy,cx+8,cy,'#fff',2);line(cx,cy-8,cx,cy+8,'#fff',2);c.restore()}
function glitchText(s,x,y,size,t,color='#f5efff',align='left'){
 c.save();let jitter=reduced?0:(Math.sin(t*7)> .965?9:2.7);text(s,x-jitter,y+1,size,CYAN,false,align,900);text(s,x+jitter,y-1,size,MAGENTA,false,align,900);text(s,x,y,size,color,false,align,900);
 if(!reduced&&Math.sin(t*2.3)>.86){c.save();c.beginPath();c.rect(0,y+size*.43,1920,size*.055);c.clip();text(s,x+13,y,size,CYAN,false,align,900);c.restore()}c.restore();
}
function hazard(x,y,width,t){c.save();c.beginPath();c.rect(x,y,width,8);c.clip();for(let i=-20;i<width+20;i+=19){let offset=reduced?0:(t*14)%19;line(x+i+offset,y+9,x+i+12+offset,y-2,LIME,5)}c.restore()}
function intro(t){
 let enter=smooth(t/.7),leave=1-smooth((t-3.6)/.65);c.save();c.globalAlpha=enter*leave;
 for(let i=0;i<9;i++){let p=(i/9+(reduced?0:t*.055))%1,sz=130+Math.pow(p,2)*1100,alpha=(1-p)*.45;c.save();c.translate(960,500);c.rotate(Math.PI/4+(reduced?0:Math.sin(t*.18)*.06));box(-sz/2,-sz/2,sz,sz,null,0,`rgba(${i%2?'255,30,211':'0,241,255'},${alpha})`);c.restore()}
 core(960,482,185,t);glitchText('NEON ORBIT',960,765,65,t,'#f4efff','center');tracked('BOOTING THE AFTERHOURS',750,854,11,CYAN,3);hazard(780,916,360,t);text(String(Math.floor(clamp(t/4)*100)).padStart(3,'0')+'%',960,943,12,LIME,true,'center');c.restore();
}
function cutPanel(x,y,width,height,title,accent=CYAN){
 c.beginPath();c.moveTo(x+13,y);c.lineTo(x+width,y);c.lineTo(x+width,y+height-13);c.lineTo(x+width-13,y+height);c.lineTo(x,y+height);c.lineTo(x,y+13);c.closePath();c.fillStyle='#0b051be8';c.fill();c.strokeStyle=accent+'66';c.lineWidth=1;c.stroke();box(x+13,y,86,3,accent);text(title,x+18,y+16,10,accent,true);line(x+18,y+39,x+width-18,y+39,accent+'30');
}
function dashboard(t){
 let q=t-4,p=clamp(q/7.1);c.save();c.globalAlpha=smooth(q/.55);
 box(61,214,25,4,LIME);tracked('GO BEYOND THE ORDINARY',104,209,11,LIME,2.6);
 glitchText('WAKE THE',62,250,111,t);glitchText('FUTURE.',62,359,133,t+.2,CYAN);
 text('零点之后，未来上线。',70,516,20,'#f0a5da',false);text('YOUR WORKSPACE. REWIRED.',72,554,12,'#9975a4',true);
 // A large luminous particle reactor and broken targeting rings.
 glow(1272,496,315,'#ff08ba25');core(1272,496,221,t);
 for(let i=0;i<4;i++){let a=t*(i%2?.12:-.10)+i*.9;arc(1272,496,281+i*9,a,a+.57,i%2?MAGENTA:CYAN,i%2?2.5:1)}
 line(952,496,1007,496,CYAN,1);line(1537,496,1592,496,MAGENTA,1);line(1272,179,1272,222,CYAN);line(1272,771,1272,802,MAGENTA);
 cutPanel(1517,228,328,116,'NEURAL FREQUENCY',MAGENTA);text((77.2+Math.sin(t*.7)*.8).toFixed(2),1538,277,34,'#fff0fa',false,'left',600);text('THz / LINK ACTIVE',1827,292,9,MAGENTA,true,'right');line(1517,318,1457,359,MAGENTA+'80');
 cutPanel(1578,625,267,132,'SIGNAL INTEGRITY',CYAN);for(let i=0;i<32;i++){let bh=8+hash(i+8)*30*(.65+Math.sin(t*.9+i)*.2);box(1596+i*7.2,711-bh,4,bh,i>22?MAGENTA:CYAN)}text('99.8%  //  STABLE',1597,731,10,CYAN,true);
 text('N / O',1272,487,15,'#fff',true,'center');text('QUANTUM FIELD / 001',999,202,10,'#c28dc8',true);text('X 08.77  Y 20.26',1418,812,10,'#b385bf',true,'right');
 // Terminal console: intentionally big enough to read, not dense filler.
 cutPanel(65,616,594,209,'// SEQUENCE CONSOLE',MAGENTA);let entries=['INITIALIZE_VISUAL_ENGINE','MAP_LOCAL_WORKSPACE','SYNCHRONIZE_DISPLAY_LINK','ARM_FOCUS_HANDOFF','ORBITAL_UPLINK_ESTABLISHED'];for(let i=0;i<5;i++){let yy=675+i*25,active=q>i*.95;text('0'+(i+1),85,yy,10,'#684b7f',true);text(entries[i],118,yy,10,active?'#d5b5dd':'#51355e',true);if(active)text('[ OK ]',637,yy,10,i===4?LIME:CYAN,true,'right')}
 // Big graphic barcode and small industrial details.
 for(let i=0;i<45;i++){let bx=1720+i*2.7;box(bx,872,hash(i+99)>.7?2.7:1,37,hash(i)> .45?'#ff44ca99':'#33e6f099')}text('N/O—077—2026',1847,920,9,'#cb74c3',true,'right');
 let bx=67,by=895,bw=1470;tracked('UPLINK IN PROGRESS',bx,by-30,10,CYAN,2);text(Math.floor(p*100).toString().padStart(3,'0')+'%',1534,by-57,39,LIME,true,'right');for(let i=0;i<74;i++)box(bx+i*bw/74,by,bw/74-4,12,i/74<p?(i>51?MAGENTA:CYAN):'#241431');text('BOOT',bx,924,9,'#c58bcd',true);text('SYNC',800,924,9,p>.35?CYAN:'#68486e',true);text('ENTER',1533,924,9,p>.94?LIME:'#68486e',true,'right');
 c.restore();
}
function ready(t){
 let a=smooth((t-11.3)/.5);c.save();c.globalAlpha=a;box(0,177,1920,786,'#090215e8');glow(960,540,540,'#e000ae24');
 hazard(650,262,620,t);tracked('UPLINK COMPLETE // ENTER THE NEXT',704,299,11,LIME,1.8);brandMark(960,414,90);
 glitchText('FUTURE',960,512,146,t,'#fcf3ff','center');glitchText('IS ONLINE.',960,652,103,t+.1,CYAN,'center');
 box(791,821,338,47,'#fa0cc326',0,'#ff24cbbf');text('未来已上线  /  ENTER ↗',960,835,16,'#ffbbee',true,'center');text('RETURNING TO YOUR WORKSPACE',960,906,10,'#b07cba',true,'center');c.restore();
}
function postFX(t){
 for(let y=0;y<1080;y+=4)box(0,y,1920,1,'#00000027');
 let scan=reduced?640:(t*64)%1240-80;let grad=c.createLinearGradient(0,scan,0,scan+68);grad.addColorStop(0,'transparent');grad.addColorStop(.9,'#3be6ff09');grad.addColorStop(1,'transparent');box(0,scan,1920,68,grad);
 if(!reduced&&Math.sin(t*2.3)>.96){box(0,322,1920,3,'#ff15cf32');box(60,613,156,4,'#00ffff77')}
 line(45,982,1875,982,'#fa25cc55');text('N/O — AFTERHOURS EDITION',62,1005,10,'#d28bce',true);text('SIMULATED TELEMETRY / ORIGINAL VISUALS',962,1005,9,'#85638e',true,'center');
}
function renderAt(t){c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);c.translate(OX,OY);c.scale(S,S);background(t);header(t);if(t<4.3)intro(t);if(t>=4)dashboard(t);if(t>=11.3)ready(t);postFX(t);if(t>=13.65){let p=smooth((t-13.65)/.55);c.save();c.globalCompositeOperation='destination-out';c.beginPath();c.ellipse(960,540,2000*p,1500*p,0,0,TAU);c.fill();c.restore()}return true}
window.renderAt=renderAt;
function notify(action){try{window.webkit.messageHandlers.launcher.postMessage(action)}catch(_) {}}
function finish(){if(finished)return;finished=true;document.getElementById('skip').style.display='none';notify('done')}
document.getElementById('skip').addEventListener('click',finish);addEventListener('keydown',e=>{if(e.key==='Escape')finish()});
const start=performance.now();function frame(now){if(window.stopAnimation||finished)return;const t=(now-start)/1000;renderAt(t);if(t>=4&&!launched){launched=true;notify('launch')}if(t>=14.2){finish();return}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
