<!doctype html>
<html lang="en">

<title>NEON ORBIT / Launch Sequence</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040710}canvas{display:block;width:100%;height:100%}button{position:fixed;right:34px;bottom:27px;z-index:2;border:1px solid #ffffff22;border-radius:30px;background:#101724a0;color:#91a6ba;padding:9px 15px;font:10px -apple-system,sans-serif;letter-spacing:1px;cursor:pointer}button:hover{color:#fff;border-color:#70eaff88}button:focus-visible{outline:2px solid #70eaff;outline-offset:4px}@media(prefers-reduced-motion:reduce){button{color:#fff}}</style>

<body><canvas id="stage" aria-label="Neon Orbit futuristic launch animation"></canvas><button id="skip" type="button" aria-label="Skip animation">SKIP SEQUENCE&nbsp; ↗ &nbsp;ESC</button>
<script>
'use strict';
// All geometry is generated locally. The instrument readings are decorative.
const canvas=document.getElementById('stage'),c=canvas.getContext('2d');
const TAU=Math.PI*2,CYAN='#79efff',VIOLET='#a49bff',MINT='#b6ffe2';
let W=0,H=0,S=1,OX=0,OY=0,DPR=1,launched=false,finished=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>(x=clamp(x),x*x*(3-2*x));
const hash=n=>{let v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const stars=Array.from({length:170},(_,i)=>({x:hash(i+1)*1920,y:hash(i+350)*1080,r:.4+hash(i+600)*1.2,z:hash(i+900)}));
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);S=Math.min(W/1920,H/1080);OX=(W-1920*S)/2;OY=(H-1080*S)/2}addEventListener('resize',resize);resize();
function box(x,y,w,h,fill,r=0,stroke=null){if(w<=0||h<=0)return;c.beginPath();if(r)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
function text(s,x,y,size=12,color='#8a9aae',mono=false,align='left',weight=400){c.font=`${weight} ${size}px ${mono?'Menlo,monospace':'-apple-system,BlinkMacSystemFont,sans-serif'}`;c.textBaseline='top';c.textAlign=align;c.fillStyle=color;c.fillText(s,x,y)}
function line(x,y,x2,y2,color,width=1){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function dot(x,y,r,color){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=color;c.fill()}
function arc(x,y,r,a,b,color,width=1){c.beginPath();c.arc(x,y,r,a,b);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function glow(x,y,r,color){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');box(x-r,y-r,r*2,r*2,g)}
function tracked(s,x,y,size=10,color='#8299b1',spacing=3){c.font=`500 ${size}px Menlo,monospace`;c.textBaseline='top';c.textAlign='left';c.fillStyle=color;for(let char of s){c.fillText(char,x,y);x+=c.measureText(char).width+spacing}}
function diamond(x,y,r,color,fill=false){c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*.62,y);c.lineTo(x,y+r);c.lineTo(x-r*.62,y);c.closePath();c.strokeStyle=color;c.lineWidth=1.4;if(fill){c.fillStyle=color;c.fill()}else c.stroke()}
function brandMark(x,y,size){c.save();c.translate(x,y);c.rotate(-.55);c.strokeStyle=CYAN;c.lineWidth=size*.035;c.beginPath();c.ellipse(0,0,size*.46,size*.20,0,.15,TAU-.45);c.stroke();c.beginPath();c.ellipse(0,0,size*.46,size*.20,Math.PI/2,.7,TAU-.1);c.stroke();c.restore();diamond(x,y,size*.20,'#e9fcff',true);dot(x+size*.34,y-size*.32,size*.042,VIOLET)}
function background(t){box(-OX/S,-OY/S,W/S,H/S,'#040710');let g=c.createRadialGradient(1010,475,10,1010,475,840);g.addColorStop(0,'#101a34');g.addColorStop(.46,'#080f20');g.addColorStop(1,'#040710');box(0,0,1920,1080,g);glow(1410,660,480,'#24214f22');glow(530,190,390,'#10394b19');for(let star of stars){let x=star.x+(reduced?0:Math.sin(t*.09+star.z*6)*5),a=.15+star.z*.45;dot(x,star.y,star.r,`rgba(176,213,255,${a})`)}c.save();c.globalAlpha=.25;for(let x=0;x<=1920;x+=80)line(x,0,x,1080,'#49739612');for(let y=0;y<=1080;y+=80)line(0,y,1920,y,'#49739612');c.restore();for(let x of [40,1880])for(let y of [40,1040]){let dx=x<100?1:-1,dy=y<100?1:-1;line(x,y,x+dx*20,y,'#42637d88');line(x,y,x,y+dy*20,'#42637d88')}let sweep=(t*42)%1200-100;line(40,sweep,1880,sweep,'#80c5ff05');}
function header(t){brandMark(75,79,48);tracked('NEON / ORBIT',118,61,15,'#d9f3ff',4);tracked('PERSONAL LAUNCH SYSTEM',119,88,8,'#587289',2.4);text('N° 001',1780,66,12,'#69839b',true,'right');dot(1810,72,3,CYAN);text('LOCAL',1823,66,10,'#b2d9e9',true);line(48,122,1872,122,'#74a6d320');text('LAUNCH SEQUENCE',55,145,9,'#68849c',true);text(t<4?'01 / INITIALIZE':t<11.6?'02 / SYNCHRONIZE':'03 / HANDOFF',1865,145,9,'#93b4ca',true,'right');}
function orbitPoint(a,tilt,yaw,r){let x=Math.cos(a)*r,y=Math.sin(a)*r*Math.cos(tilt),z=Math.sin(a)*r*Math.sin(tilt);return [x*Math.cos(yaw)-y*Math.sin(yaw),x*Math.sin(yaw)+y*Math.cos(yaw),z]}
function orbit(cx,cy,r,tilt,yaw,t,color,phase=0){for(let part=0;part<2;part++){c.beginPath();for(let j=0;j<=100;j++){let a=phase+part*Math.PI+j/100*(Math.PI-.19),pt=orbitPoint(a,tilt,yaw,r);if(j===0)c.moveTo(cx+pt[0],cy+pt[1]);else c.lineTo(cx+pt[0],cy+pt[1])}c.strokeStyle=color;c.lineWidth=1.2;c.stroke()}let pt=orbitPoint(t*.55+phase,tilt,yaw,r);glow(cx+pt[0],cy+pt[1],16,color+'35');dot(cx+pt[0],cy+pt[1],3,color);}
function core(cx,cy,r,t,p=1){c.save();c.globalAlpha=p;glow(cx,cy,r*1.75,'#3268c01a');glow(cx,cy,r*.80,'#66ddff17');let spin=reduced?.35:t*.13;for(let row=-5;row<=5;row++){let lat=row/6*Math.PI/2,rr=r*.71*Math.cos(lat),yy=Math.sin(lat)*r*.71;c.beginPath();for(let i=0;i<=64;i++){let angle=i/64*TAU+spin,px=Math.cos(angle)*rr,py=yy*.91+Math.sin(angle)*rr*.31;if(i===0)c.moveTo(cx+px,cy+py);else c.lineTo(cx+px,cy+py)}c.strokeStyle=`rgba(100,189,238,${.12+Math.cos(lat)*.1})`;c.lineWidth=.7;c.stroke()}for(let longitude=0;longitude<12;longitude++){c.beginPath();for(let i=0;i<=45;i++){let lat=-Math.PI/2+i/45*Math.PI,phi=longitude/12*TAU+spin,x=Math.cos(lat)*Math.cos(phi)*r*.71,z=Math.cos(lat)*Math.sin(phi),y=Math.sin(lat)*r*.71*.91+z*r*.71*.31;if(i===0)c.moveTo(cx+x,cy+y);else c.lineTo(cx+x,cy+y)}c.strokeStyle='rgba(90,170,220,.17)';c.stroke()}for(let i=0;i<58;i++){let lat=Math.asin(hash(i+65)*2-1),phi=hash(i+10)*TAU+spin,x=Math.cos(lat)*Math.cos(phi)*r*.71,z=Math.cos(lat)*Math.sin(phi),y=Math.sin(lat)*r*.71*.91+z*r*.71*.31;dot(cx+x,cy+y,z>0?1.7:.8,z>0?'#a2eaff':'#30658a')}orbit(cx,cy,r,1.13,-.52,t,CYAN);orbit(cx,cy,r*.92,.95,.63,-t,VIOLET,1.2);orbit(cx,cy,r*1.16,1.28,.15,t*.67,'#4d88b5',2.7);arc(cx,cy,r*1.3,-Math.PI*.72,Math.PI*.25,'#73b6e324');for(let i=0;i<72;i++){let a=i/72*TAU,inner=r*1.28,outer=inner+(i%6===0?11:4);line(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner,cx+Math.cos(a)*outer,cy+Math.sin(a)*outer,i%6===0?'#a5d9f77a':'#6b9bbb2c',.8)}let pulse=1+(reduced?0:Math.sin(t*1.4)*.035);glow(cx,cy,74*pulse,'#89eeff35');c.save();c.shadowColor=CYAN;c.shadowBlur=24;diamond(cx,cy,43*pulse,'#ddfbff');diamond(cx,cy,22*pulse,'#93efff',true);c.restore();line(cx-8,cy,cx+8,cy,'#fff',2);line(cx,cy-8,cx,cy+8,'#fff',2);c.restore()}
function intro(t){let enter=smooth(t/1.25),expand=smooth((t-2.9)/1.1);c.save();c.globalAlpha=1-expand*.6;core(960,490,185+expand*20,t,enter);c.restore();c.save();c.globalAlpha=smooth((t-.65)/.8)*(1-expand);tracked('N E O N   O R B I T',771,790,15,'#d9f4ff',4);text('A new point of departure.',960,831,16,'#738ca4',false,'center');text('ESTABLISHING LOCAL ORBIT',960,916,9,'#74a9bc',true,'center');let bar=220,fill=bar*clamp(t/4);box(850,944,bar,2,'#152d40');box(850,944,fill,2,CYAN);c.restore();}
function panel(x,y,w,h,label,index){box(x,y,w,h,'#0a142185',8,'#7fafe529');line(x+18,y+43,x+w-18,y+43,'#719ac625');text(index,x+18,y+15,9,'#516c89',true);tracked(label,x+49,y+14,9,'#bed8eb',1.6);line(x,y+15,x,y+38,CYAN,2);}
function waveform(x,y,w,h,t){for(let j=0;j<3;j++)line(x,y+j*h/2,x+w,y+j*h/2,'#6283a522',.6);c.beginPath();for(let i=0;i<=150;i++){let f=i/150,amplitude=(.18+.5*Math.pow(Math.sin(f*Math.PI),2)),v=Math.sin(f*48+t*2)*Math.sin(f*18-t*.7)*amplitude,hx=x+f*w,hy=y+h/2+v*h*.47;if(i===0)c.moveTo(hx,hy);else c.lineTo(hx,hy)}c.strokeStyle=CYAN;c.lineWidth=1.3;c.stroke();}
function dashboard(t){let q=t-4,enter=smooth(q/.8),progress=clamp(q/7.1);c.save();c.globalAlpha=enter;
 panel(62,233,294,260,'SIGNAL ARRAY','01');text('ORBITAL FREQUENCY',82,298,9,'#69839c',true);text((42.8+Math.sin(t*.5)*.4).toFixed(2),81,320,42,'#d7f4ff',false,'left',300);text('THz',219,342,10,'#6d91a8',true);waveform(83,393,248,57,t);text('COHERENCE',83,468,9,'#628096',true);text((94+progress*5.9).toFixed(1)+'%',332,468,9,CYAN,true,'right');
 panel(62,516,294,245,'LOCAL SUBSYSTEMS','02');let labels=['WINDOW BRIDGE','ORBITAL ENGINE','DISPLAY LINK','HANDOFF CHANNEL'];for(let i=0;i<4;i++){let y=584+i*39,online=q>i*.85+.4;dot(85,y+5,2.5,online?CYAN:'#3e4c60');text(labels[i],100,y,9,'#aac1d4',true);text(online?'LINKED':'WAIT',331,y,8,online?MINT:'#52637a',true,'right');if(i<3)line(82,y+24,335,y+24,'#a5bad310')}
 panel(1564,233,294,309,'VECTOR TOPOLOGY','03');let nodes=[];for(let i=0;i<17;i++)nodes.push([1600+hash(i+14)*218,306+hash(i+45)*168]);for(let i=0;i<nodes.length;i++){let a=nodes[i];for(let j=i+1;j<nodes.length;j++){let b=nodes[j],distance=Math.hypot(a[0]-b[0],a[1]-b[1]);if(distance<75)line(...a,...b,'#68d4fc30',.7)}dot(...a,2,i%3===0?VIOLET:CYAN)}text('17 NODES / STABLE MESH',1585,512,9,'#7797ae',true);
 panel(1564,565,294,196,'SEQUENCE LOG','04');let logs=['visual engine / initialized','local route / selected','display sync / aligned','focus bridge / armed','orbital link / established'];for(let i=0;i<5;i++){if(q>i*1.2)text('› '+logs[i],1584,624+i*23,8.5,i===4?MINT:'#7d9cb4',true)}
 // Left and right leader lines frame the central hologram.
 line(396,463,470,463,'#73c9eb35');line(470,463,536,529,'#73c9eb35');dot(536,529,2,CYAN);line(1387,383,1461,309,'#a79bff40');line(1461,309,1524,309,'#a79bff40');dot(1387,383,2,VIOLET);
 text('FIELD / 001',532,322,9,'#81b0c9',true);text('Y +0.003',1391,748,9,'#637e98',true,'right');tracked('THE NEXT FRONTIER',693,209,11,'#7d9db8',4.5);text('Within reach.',960,245,53,'#e1f3ff',false,'center',300);
 core(960,554,188,t);text('N / O',960,835,12,CYAN,true,'center');tracked('SYNCHRONIZING YOUR WORKSPACE',715,864,9,'#7797ae',2);
 c.restore();
 // Segmented, restrained timeline instead of an imitation model selector.
 c.save();c.globalAlpha=enter;let bx=463,by=925,bw=994;for(let i=0;i<64;i++){let active=i/64<progress;box(bx+i*bw/64,by,bw/64-5,4,active?(i>49?VIOLET:CYAN):'#172c40',1)}text('SEQUENCE PROGRESS',bx,946,8,'#5b7990',true);text(String(Math.floor(progress*100)).padStart(2,'0')+' / 100',bx+bw,945,10,'#b9dfed',true,'right');text('INITIALIZE',bx,976,8,'#658ca2',true);text('SYNCHRONIZE',960,976,8,progress>.4?CYAN:'#4a6378',true,'center');text('HANDOFF',bx+bw,976,8,progress>.92?VIOLET:'#4a6378',true,'right');c.restore();}
function ready(t){let a=smooth((t-11.3)/.65);c.save();c.globalAlpha=a;box(0,170,1920,820,'#040710e8');glow(960,492,340,'#483e8625');glow(960,492,230,'#3095ad18');brandMark(960,400,114);tracked('ORBITAL LINK ESTABLISHED',710,537,12,CYAN,3);text('Ready for what’s next.',960,581,66,'#e7f6ff',false,'center',300);text('Your workspace is one transition away.',960,672,16,'#7892aa',false,'center');let remaining=clamp((14-t)/2.5);arc(960,779,25,-Math.PI/2,-Math.PI/2+TAU*remaining,'#79efff',1.4);text('↗',960,769,17,'#d9f4ff',false,'center');text('NEON ORBIT  /  LOCAL LAUNCHER',960,909,9,'#58738b',true,'center');c.restore();}
function renderAt(t){c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);c.translate(OX,OY);c.scale(S,S);background(t);header(t);if(t<4.3)intro(t);if(t>=4)dashboard(t);if(t>=11.3)ready(t);text('N / O — 2026',55,1026,9,'#47627b',true);text('VISUAL TELEMETRY / ARTISTIC SEQUENCE',960,1026,8,'#415b74',true,'center');if(t>=13.65){let p=smooth((t-13.65)/.55);c.save();c.globalCompositeOperation='destination-out';c.beginPath();c.ellipse(960,540,2000*p,1500*p,0,0,TAU);c.fill();c.restore()}return true}
window.renderAt=renderAt;
function notify(action){try{window.webkit.messageHandlers.launcher.postMessage(action)}catch(_) {}}
function finish(){if(finished)return;finished=true;document.getElementById('skip').style.display='none';notify('done')}
document.getElementById('skip').addEventListener('click',finish);addEventListener('keydown',e=>{if(e.key==='Escape')finish()});
const start=performance.now();function frame(now){if(window.stopAnimation||finished)return;const t=(now-start)/1000;renderAt(t);if(t>=4&&!launched){launched=true;notify('launch')}if(t>=14.2){finish();return}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
